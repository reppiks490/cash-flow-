name: Verify Revenue Recovery synthetic prototype
on:
  push:
    paths:
      - 'products/revenue_recovery/**'
      - '.github/workflows/verify-revenue-recovery.yml'
  pull_request:
    paths:
      - 'products/revenue_recovery/**'
      - '.github/workflows/verify-revenue-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated synthetic RRE unit and HTTP tests
        env:
          PYTHONPATH: products/revenue_recovery
        run: python -m unittest discover -s products/revenue_recovery -p 'test_*.py' -v

      - name: Verify browser JavaScript syntax (non-Codex, no dependencies)
        run: node --check products/revenue_recovery/web/app.js

      - name: Exercise synthetic browser interactions (Node built-ins only)
        run: node --test products/revenue_recovery/web/test_app.mjs products/revenue_recovery/web/dom_contract.test.cjs products/revenue_recovery/web/synthetic_gate.test.cjs products/revenue_recovery/web/view_races.test.cjs products/revenue_recovery/web/test_refresh_race.mjs products/revenue_recovery/web/mobile_accessibility.test.cjs products/revenue_recovery/web/test_draft_edit_race.js
